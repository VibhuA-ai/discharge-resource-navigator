<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Discharge Resource Navigator</title>
  <meta name="description" content="Next steps for IHH clients leaving recuperative care. Runs entirely in your browser.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.2/build/stlite.css">
  <style>
    #loading { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: #202A35; max-width: 560px; margin: 15vh auto 0; padding: 0 16px; }
    #loading h1 { font-size: 1.5rem; margin: 0 0 .4em; }
    #loading p { margin: .4em 0; color: #4a5866; }
  </style>
</head>
<body>
  <div id="root">
    <div id="loading" role="status">
      <h1>🧭 Discharge Resource Navigator</h1>
      <p>Loading… The first visit takes about 10 to 20 seconds while Python starts in your browser.</p>
      <p>Everything runs on this device. Nothing you type is sent to a server.</p>
    </div>
  </div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.2/build/stlite.js";
    // The same app.py, matcher.py and data file as the repository, copied in by the Pages workflow.
    mount(
      {
        requirements: [],
        entrypoint: "app.py",
        files: {
          "app.py": { url: "./app.py" },
          "matcher.py": { url: "./matcher.py" },
          "data/resources.csv": { url: "./data/resources.csv" },
        },
      },
      document.getElementById("root"),
    );
  </script>
</body>
</html>
